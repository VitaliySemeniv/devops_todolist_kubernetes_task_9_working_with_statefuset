apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: todo
spec:
  replicas: 2
  selector:
    matchLabels: { app: todo }
  template:
    metadata:
      labels: { app: todo }
    spec:
      containers:
      - name: todo
        image: yourorg/todo:latest     # ⬅️ заміни на свій образ
        env:
        - { name: DB_NAME,     valueFrom: { secretKeyRef: { name: app-db, key: NAME     } } }
        - { name: DB_USER,     valueFrom: { secretKeyRef: { name: app-db, key: USER     } } }
        - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: app-db, key: PASSWORD } } }
        - { name: DB_HOST,     valueFrom: { secretKeyRef: { name: app-db, key: HOST     } } }
        ports: [ { containerPort: 8080 } ]   # ⬅️ заміни, якщо інший порт
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests: { cpu: "100m", memory: "128Mi" }
          limits:   { cpu: "500m", memory: "256Mi" }
